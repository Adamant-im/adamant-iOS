name: Pre-merge Tests

on:
  pull_request_review:
    types: [submitted]

jobs:
  trigger_tests:
    if: |
      github.event.review.state == 'approved' && 
      github.event.pull_request.base.ref == 'develop'
    uses: ./.github/workflows/test-execution.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}